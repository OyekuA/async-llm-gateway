services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_PATH=/data/task_state.db
      - OLLAMA_URL=http://ollama:11434
      - MOCK_MODE=true
      - LOG_LEVEL=info
    volumes:
      - task_data:/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_PATH=/data/task_state.db
      - OLLAMA_URL=http://ollama:11434
      - MOCK_MODE=true
      - LOG_LEVEL=info
    volumes:
      - task_data:/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: >
      celery -A worker.celery_app worker --concurrency=4 --pool=prefork --loglevel=info

volumes:
  task_data:
